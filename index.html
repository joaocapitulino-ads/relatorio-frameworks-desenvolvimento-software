<html lang="pt-BR"><head>
    <title>Cadastro de Cliente</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fw-bold">Cadastro de Cliente</span>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">

                <div id="resultado" class="alert d-none" role="alert"></div>

                <form id="formCadastro" class="card card-body shadow-sm" novalidate="" autocomplete="off">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" placeholder="Nome">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="sobrenome" class="form-label">Sobrenome</label>
                            <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group has-validation">
                                <input type="password" class="form-control" id="senha" placeholder="Mínimo de 6 caracteres">
                                <button class="btn btn-outline-secondary" type="button" id="verSenha">Mostrar</button>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <div class="col-12">
                            <h5 class="mt-2 mb-0 fw-normal">Endereço</h5>
                        </div>

                        <div class="col-md-3">
                            <label for="cep" class="form-label">CEP</label>
                            <input type="text" class="form-control" id="cep" placeholder="00000-000" maxlength="9" inputmode="numeric">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-5">
                            <label for="rua" class="form-label">Rua</label>
                            <input type="text" class="form-control" id="rua" placeholder="Rua">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" class="form-control" id="bairro" placeholder="Bairro">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="cidade" placeholder="Cidade">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-2">
                            <label for="estado" class="form-label">Estado</label>
                            <input type="text" class="form-control" id="estado" placeholder="UF" maxlength="2">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-2">
                            <label for="numero" class="form-label">Número</label>
                            <input type="text" class="form-control" id="numero" placeholder="Ex: 103">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="complemento" class="form-label">Complemento</label>
                            <input type="text" class="form-control" id="complemento" placeholder="Ex: Apto 12">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-dark">Verificar</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- Dois arquivos separados, como pede o roteiro -->
    <script src="main.js"></script>
    <script src="validation.js"></script>


</body></html>
